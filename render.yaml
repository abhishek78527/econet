services:
  # Go Backend
  - type: web
    name: linkup-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o server ./main.go
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false   # Set this in Render dashboard
      - key: DB_NAME
        value: linkup
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # Set to your Render static site URL

  # React Frontend
  - type: static
    name: linkup-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # Set to https://linkup-backend.onrender.com/api/v1
      - key: VITE_WS_URL
        sync: false   # Set to wss://linkup-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
